name: Mirror to training-john-mirror

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to GitHub
        shell: bash
        run: |
          token="${{ secrets.MIRROR_RAT }}"
          if [ -z "$token" ]; then
            token="${{ secrets.MIRROR_PAT }}"
          fi
          if [ -z "$token" ]; then
            echo "Error: Neither MIRROR_RAT nor MIRROR_PAT secrets are set." >&2
            exit 1
          fi
          # Use our PAT for github.com instead of the checkout's GITHUB_TOKEN
          git config --global --unset-all http.https://github.com/.extraheader || true
          git remote remove mirror 2>/dev/null || true
          git remote add mirror https://x-access-token:$token@github.com/Maximus-Technologies-Uganda/training-john-mirror.git
          git push --mirror --prune mirror

