name: Mirror to training-john-mirror

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to GitHub
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: "https://github.com/Maximus-Technologies-Uganda/training-john-mirror.git"
          pat: ${{ secrets.MIRROR_PAT }}

