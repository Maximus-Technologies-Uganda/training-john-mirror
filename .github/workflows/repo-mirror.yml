name: Mirror to training-john-mirror

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to GitHub
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: git@github.com:johnkayiira-jpg/training-john-mirror.git
          ssh_username: git
          ssh_private_key: ${{ secrets.MIRROR_SSH_PRIVATE_KEY }}

