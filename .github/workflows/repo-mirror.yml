name: Mirror to training-john-mirror

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      MIRROR_TOKEN: ${{ secrets.MIRROR_RAT || secrets.MIRROR_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to GitHub
        shell: bash
        run: |
          if [ -z "${MIRROR_TOKEN}" ]; then
            echo "Error: Neither MIRROR_RAT nor MIRROR_PAT secrets are set." >&2
            exit 1
          fi
          git remote remove mirror 2>/dev/null || true
          git remote add mirror https://x-access-token:${MIRROR_TOKEN}@github.com/Maximus-Technologies-Uganda/training-john-mirror.git
          git push --mirror --prune mirror

