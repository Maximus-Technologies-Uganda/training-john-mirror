name: Spec → Linear sync

on:
  push:
    branches-ignore:
      - main
    paths:
      - specs/**/spec.md
      - scripts/sync-spec-to-linear.mjs
      - .github/workflows/spec-to-linear-sync.yml
  workflow_dispatch:

jobs:
  sync:
    # Only run in private repos for security (Linear API key protection)
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run spec to Linear sync
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
        run: npm run sync:specs
