name: Sync Linear Sub-Issues

on:
  push:
    branches-ignore:
      - main
    paths:
      - specs/001-ui-implement-todo-ui/tasks.md
      - scripts/sync-linear-subtasks.mjs
      - .github/workflows/sync-linear-subtasks.yml
  workflow_dispatch:
    inputs:
      parentIssueId:
        description: 'Override Linear parent issue ID'
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Linear sync
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_PARENT_ISSUE_ID: ${{ github.event.inputs.parentIssueId || secrets.LINEAR_PARENT_ISSUE_ID }}
        run: npm run sync:linear

