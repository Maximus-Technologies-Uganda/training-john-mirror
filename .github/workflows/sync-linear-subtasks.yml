name: Sync Linear Sub-Issues

on:
  push:
    branches-ignore:
      - main
    paths:
      - specs/**/tasks.md
      - scripts/sync-linear-subtasks.mjs
      - .github/workflows/sync-linear-subtasks.yml
  workflow_dispatch:
    inputs:
      parentIssueId:
        description: 'Override Linear parent issue ID (optional - will use env vars per spec if not set)'
        required: false
      tasksFile:
        description: 'Specific tasks.md file to sync (optional - syncs all if not set)'
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Linear sync
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_PARENT_ISSUE_ID: ${{ github.event.inputs.parentIssueId || secrets.LINEAR_PARENT_ISSUE_ID }}
          LINEAR_PARENT_ISSUE_ID_001_UI_SCAFFOLD_SPEC: ${{ secrets.LINEAR_PARENT_ISSUE_ID_001_UI_SCAFFOLD_SPEC }}
          LINEAR_PARENT_ISSUE_ID_002_TODO_UI: ${{ secrets.LINEAR_PARENT_ISSUE_ID_002_TODO_UI }}
          LINEAR_TASKS_FILE: ${{ github.event.inputs.tasksFile }}
        run: npm run sync:linear

