name: Mirror to Public Repo

on:
  push:
    branches:
      - development
      - feature/fix-mirror-workflow

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: https://github.com/johnkayiira-jpg/training-john-mirror.git
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh_username: git
