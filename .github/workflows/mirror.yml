name: Mirror to Another Repository

on:
  push:
    branches:
      - main # Or your default branch, like 'development'

jobs:
  mirroring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror Repository
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          # This is the corrected SSH URL
          target_repo_url: git@github.com:johnkayiira-jpg/training-john-mirror.git

          # This uses the secret you created for the private key
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
