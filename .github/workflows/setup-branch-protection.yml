name: Setup Branch Protection

on:
  workflow_dispatch:
    inputs:
      github_token:
        description: 'GitHub token with admin permissions'
        required: true
        type: string
  push:
    branches: [ development ]
    paths:
      - 'setup-branch-protection.js'

jobs:
  setup-protection:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/development')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up branch protection
        env:
          GITHUB_TOKEN: ${{ github.event.inputs.github_token || github.token }}
        run: |
          echo "Setting up branch protection for development branch..."
          node setup-branch-protection.js

      - name: Verify protection rules
        env:
          GITHUB_TOKEN: ${{ github.event.inputs.github_token || github.token }}
        run: |
          echo "Verifying branch protection rules..."
          curl -H "Authorization: Bearer $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               -H "X-GitHub-Api-Version: 2022-11-28" \
               https://api.github.com/repos/${{ github.repository }}/branches/development/protection | jq '.'
