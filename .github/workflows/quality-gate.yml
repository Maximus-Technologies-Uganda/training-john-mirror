name: Quality Gate

on:
  pull_request:
    branches: [ development ]

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      - name: Upload JUnit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: test-results/junit.xml

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

      - name: Generate and post coverage table
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            try {
              // Read coverage data from individual app coverage directories
              const apps = ['expenses', 'hello', 'jokes', 'quote', 'stopwatch', 'temp-converter', 'todo'];
              const coverageData = [];
              
              for (const app of apps) {
                const coverageFile = path.join(app, 'coverage', 'coverage-summary.json');
                if (fs.existsSync(coverageFile)) {
                  const coverage = JSON.parse(fs.readFileSync(coverageFile, 'utf8'));
                  const total = coverage.total;
                  coverageData.push({
                    app: app,
                    statements: total.statements.pct,
                    branches: total.branches.pct,
                    functions: total.functions.pct,
                    lines: total.lines.pct
                  });
                }
              }
              
              // Generate coverage table
              let table = '## 📊 Test Coverage Report\n\n';
              table += '| App | Statements | Branches | Functions | Lines |\n';
              table += '|-----|------------|----------|-----------|-------|\n';
              
              for (const data of coverageData) {
                table += `| ${data.app} | ${data.statements.toFixed(1)}% | ${data.branches.toFixed(1)}% | ${data.functions.toFixed(1)}% | ${data.lines.toFixed(1)}% |\n`;
              }
              
              // Post comment on PR
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: table
              });
              
            } catch (error) {
              console.log('Coverage table generation failed:', error.message);
              // Don't fail the workflow if coverage table generation fails
            }