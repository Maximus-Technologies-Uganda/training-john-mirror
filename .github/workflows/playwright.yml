name: Playwright Tests

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

jobs:
  test-expense:
    name: Test Expense App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: apps/expense/ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/expense/ui
        run: npx playwright install --with-deps

      - name: Build the app
        working-directory: apps/expense/ui
        run: npm run build

      - name: Start the dev server in background
        working-directory: apps/expense/ui
        run: |
          npm run dev > /tmp/expense-server.log 2>&1 &
          echo $! > /tmp/expense-server.pid
          sleep 3
          if ! ps -p $(cat /tmp/expense-server.pid) > /dev/null; then
            echo "Server failed to start!"
            cat /tmp/expense-server.log
            exit 1
          fi
        env:
          CI: true

      - name: Wait for server to be ready
        run: |
          npm install -g wait-on
          wait-on http://localhost:3000 --timeout 120000 || (echo "Server is not responding. Log:"; cat /tmp/expense-server.log; exit 1)

      - name: Run Playwright tests
        working-directory: apps/expense/ui
        run: npm run e2e
        continue-on-error: true

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-expense-artifacts
          path: apps/expense/ui/playwright-report/
          retention-days: 30

      - name: Upload to review-artifacts
        if: always()
        run: |
          mkdir -p review-artifacts/playwright/expense
          cp -r apps/expense/ui/playwright-report/* review-artifacts/playwright/expense/ || true

  test-stopwatch:
    name: Test Stopwatch App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: apps/stopwatch/ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/stopwatch/ui
        run: npx playwright install --with-deps

      - name: Build the app
        working-directory: apps/stopwatch/ui
        run: npm run build

      - name: Start the dev server in background
        working-directory: apps/stopwatch/ui
        run: |
          npm run dev > /tmp/stopwatch-server.log 2>&1 &
          echo $! > /tmp/stopwatch-server.pid
          sleep 3
          if ! ps -p $(cat /tmp/stopwatch-server.pid) > /dev/null; then
            echo "Server failed to start!"
            cat /tmp/stopwatch-server.log
            exit 1
          fi
        env:
          CI: true

      - name: Wait for server to be ready
        run: |
          npm install -g wait-on
          wait-on http://localhost:5173 --timeout 120000 || (echo "Server is not responding. Log:"; cat /tmp/stopwatch-server.log; exit 1)

      - name: Run Playwright tests
        working-directory: apps/stopwatch/ui
        run: npm run e2e
        continue-on-error: true

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-stopwatch-artifacts
          path: apps/stopwatch/ui/playwright-report/
          retention-days: 30

  test-temp:
    name: Test Temp Converter App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: apps/temp/ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/temp/ui
        run: npx playwright install --with-deps

      - name: Build the app
        working-directory: apps/temp/ui
        run: npm run build

      - name: Start the dev server in background
        working-directory: apps/temp/ui
        run: |
          npm run dev > /tmp/temp-server.log 2>&1 &
          echo $! > /tmp/temp-server.pid
          sleep 3
          if ! ps -p $(cat /tmp/temp-server.pid) > /dev/null; then
            echo "Server failed to start!"
            cat /tmp/temp-server.log
            exit 1
          fi
        env:
          CI: true

      - name: Wait for server to be ready
        run: |
          npm install -g wait-on
          wait-on http://localhost:5173 --timeout 120000 || (echo "Server is not responding. Log:"; cat /tmp/temp-server.log; exit 1)

      - name: Run Playwright tests
        working-directory: apps/temp/ui
        run: npm run e2e
        continue-on-error: true

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-temp-artifacts
          path: apps/temp/ui/playwright-report/
          retention-days: 30

  publish-artifacts:
    name: Publish Test Artifacts
    needs: [test-expense, test-stopwatch, test-temp]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create review-artifacts directory
        run: mkdir -p review-artifacts/playwright

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: playwright-downloads

      - name: Organize artifacts
        run: |
          mkdir -p review-artifacts/playwright/expense
          mkdir -p review-artifacts/playwright/stopwatch
          mkdir -p review-artifacts/playwright/temp
          
          if [ -d "playwright-downloads/playwright-expense-artifacts" ]; then
            cp -r playwright-downloads/playwright-expense-artifacts/* review-artifacts/playwright/expense/ || true
          fi
          
          if [ -d "playwright-downloads/playwright-stopwatch-artifacts" ]; then
            cp -r playwright-downloads/playwright-stopwatch-artifacts/* review-artifacts/playwright/stopwatch/ || true
          fi
          
          if [ -d "playwright-downloads/playwright-temp-artifacts" ]; then
            cp -r playwright-downloads/playwright-temp-artifacts/* review-artifacts/playwright/temp/ || true
          fi

      - name: Upload final artifacts to review-artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-artifacts
          path: review-artifacts/
          retention-days: 90

