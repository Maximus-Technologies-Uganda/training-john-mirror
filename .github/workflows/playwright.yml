name: Playwright Tests

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

jobs:
  test-expense:
    name: Test Expense App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: apps/expense/ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/expense/ui
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: apps/expense/ui
        run: npm run e2e
        continue-on-error: true

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-expense-artifacts
          path: apps/expense/ui/test-results/playwright/
          retention-days: 30

      - name: Upload to review-artifacts
        if: always()
        run: |
          mkdir -p review-artifacts/playwright/expense
          cp -r apps/expense/ui/test-results/playwright/* review-artifacts/playwright/expense/ || true

  test-stopwatch:
    name: Test Stopwatch App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: apps/stopwatch/ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/stopwatch/ui
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: apps/stopwatch/ui
        run: npm run e2e
        continue-on-error: true

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-stopwatch-artifacts
          path: apps/stopwatch/ui/test-results/playwright/
          retention-days: 30

  test-temp:
    name: Test Temp Converter App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: apps/temp/ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/temp/ui
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: apps/temp/ui
        run: npm run e2e
        continue-on-error: true

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-temp-artifacts
          path: apps/temp/ui/test-results/playwright/
          retention-days: 30

  publish-artifacts:
    name: Publish Test Artifacts
    needs: [test-expense, test-stopwatch, test-temp]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Create review-artifacts directory
        run: mkdir -p review-artifacts/playwright

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: playwright-downloads

      - name: Organize artifacts
        run: |
          mkdir -p review-artifacts/playwright/expense
          mkdir -p review-artifacts/playwright/stopwatch
          mkdir -p review-artifacts/playwright/temp
          
          if [ -d "playwright-downloads/playwright-expense-artifacts" ]; then
            cp -r playwright-downloads/playwright-expense-artifacts/* review-artifacts/playwright/expense/ || true
          fi
          
          if [ -d "playwright-downloads/playwright-stopwatch-artifacts" ]; then
            cp -r playwright-downloads/playwright-stopwatch-artifacts/* review-artifacts/playwright/stopwatch/ || true
          fi
          
          if [ -d "playwright-downloads/playwright-temp-artifacts" ]; then
            cp -r playwright-downloads/playwright-temp-artifacts/* review-artifacts/playwright/temp/ || true
          fi

      - name: Upload final artifacts to review-artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-artifacts
          path: review-artifacts/
          retention-days: 90

